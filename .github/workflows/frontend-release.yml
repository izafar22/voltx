name: Frontend release artifact

on:
  workflow_dispatch:
  push:
    branches:
      - 'release_*'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: |
          corepack enable
          cd frontend
          yarn install --frozen-lockfile
      - name: Build production frontend
        run: cd frontend && CI=true yarn build
      - name: Verify build entrypoint
        run: test -s frontend/build/index.html
      - name: Package deployment files
        run: tar -C frontend/build -czf rushx-frontend.tar.gz .
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: rushx-frontend-${{ github.sha }}
          path: rushx-frontend.tar.gz
          if-no-files-found: error
          retention-days: 14

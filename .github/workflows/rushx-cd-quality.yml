name: RushX CD quality gates

on:
  pull_request:
    branches: [repair-mvp]
  push:
    branches: [repair-mvp]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rushx-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Verify deployment and rollback regression tests
        run: bash scripts/test-oracle-frontend-deploy.sh
      - name: Install locked dependencies
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Unit tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false
      - name: Production build
        working-directory: frontend
        run: CI=true yarn build
      - name: Validate build output
        run: |
          test -s frontend/build/index.html
          test -n "$(find frontend/build/static/js -type f -name '*.js' -size +0c -print -quit)"
          test -n "$(find frontend/build/static/css -type f -name '*.css' -size +0c -print -quit)"
      - name: Package immutable artifact
        if: github.event_name != 'pull_request'
        run: |
          tar -C frontend/build -czf rushx-frontend.tar.gz .
          sha256sum rushx-frontend.tar.gz > rushx-frontend.tar.gz.sha256
      - name: Upload verified artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: rushx-frontend-${{ github.sha }}
          path: |
            rushx-frontend.tar.gz
            rushx-frontend.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  security:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dependency vulnerabilities
        working-directory: frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn audit --level critical --groups dependencies

name: RushX CI

on:
  pull_request:
    branches: [repair-mvp]
  push:
    branches: [repair-mvp]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rushx-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt mongomock-motor
      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30); do
            if python -c 'from pymongo import MongoClient; MongoClient("mongodb://localhost:27017", serverSelectionTimeoutMS=1000).admin.command("ping")' ; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Start disposable test API
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: rushx_ci
          JWT_SECRET: ci-only-not-a-production-secret-long-enough-123456
          APP_ENV: test
          OTP_MODE: demo
          EXPOSE_DEMO_OTP: 'true'
          CORS_ORIGINS: http://localhost:3000
          WHATSAPP_ENABLED: 'false'
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/rushx-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8001/openapi.json; then exit 0; fi
            sleep 2
          done
          cat /tmp/rushx-api.log
          exit 1
      - name: Run backend tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: rushx_ci
          JWT_SECRET: ci-only-not-a-production-secret-long-enough-123456
          APP_ENV: test
          OTP_MODE: demo
          EXPOSE_DEMO_OTP: 'true'
          CORS_ORIGINS: http://localhost:3000
          REACT_APP_BACKEND_URL: http://localhost:8001
          WHATSAPP_ENABLED: 'false'
        run: python -m pytest -q tests

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - name: Run frontend tests
        env:
          CI: 'true'
        run: yarn test --watchAll=false --runInBand
      - name: Build frontend
        env:
          CI: 'false'
        run: yarn build

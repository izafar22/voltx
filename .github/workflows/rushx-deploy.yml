name: RushX deploy (manual, gated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/rushx-ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: rushx-production
    if: github.ref == 'refs/heads/repair-mvp'
    steps:
      - name: Require explicitly configured backend deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_BACKEND_SERVICE_ID: ${{ vars.RENDER_BACKEND_SERVICE_ID }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "Missing RENDER_API_KEY"; exit 1; }
          test -n "$RENDER_BACKEND_SERVICE_ID" || { echo "Missing RENDER_BACKEND_SERVICE_ID"; exit 1; }
          response=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_BACKEND_SERVICE_ID/deploys")
          echo "Render accepted backend deploy request (not proof of a successful rollout)."
          echo "$response" | python -c 'import json,sys; d=json.load(sys.stdin); print("Deploy ID:", d.get("id","unknown"))'

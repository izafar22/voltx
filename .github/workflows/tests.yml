name: Tests
on:
  push:
    branches: [repair-mvp, 'release_*']
  pull_request:
    branches: [repair-mvp]

permissions:
  contents: read
jobs:
  test:
    outputs:
      artifact_name: ${{ steps.bundle.outputs.name }}
    # MongoDB 8 refuses kernels 6.19+ used by the moving ubuntu-latest image.
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: voltx_ci
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      APP_ENV: test
      OTP_MODE: demo
      # Existing live auth regression asserts the demo code on this disposable test API.
      EXPOSE_DEMO_OTP: 'true'
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan introduced changes for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check-oracle-secrets.sh
      - name: Oracle frontend deploy regression tests
        run: bash scripts/test-oracle-frontend-deploy.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unified Oracle deployment regression tests
        run: python3 -m unittest discover -s scripts -p 'test_oracle_release.py'
      - run: pip install -r backend/requirements.txt -r backend/requirements-test.txt
      - name: Start disposable API
        run: |
          cd backend
          uvicorn server:app --port 8001 > /tmp/voltx-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8001/api/; then exit 0; fi
            sleep 1
          done
          cat /tmp/voltx-api.log
          exit 1
      - run: cd backend && python -m pytest
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && CI=true yarn test --watchAll=false --runInBand
      - name: Build frontend for same-origin HTTPS deployment
        env:
          REACT_APP_DEMO_AUTH: 'false'
          REACT_APP_BACKEND_URL: ''
        run: cd frontend && yarn build
      - name: Public education browser checks
        run: |
          cd frontend/e2e
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-education-browser-results
          path: frontend/e2e/test-results
      - name: Build isolated RushX Storybook
        run: cd frontend && yarn build-storybook
      - name: Storybook smoke, accessibility and visual checks
        run: cd frontend/e2e && npx playwright test --config storybook.playwright.config.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storybook-review-results
          path: |
            frontend/e2e/test-results
            frontend/e2e/test-results-storybook
            frontend/e2e/storybook-snapshots

      - name: Package tested frontend and backend
        id: bundle
        run: |
          bash scripts/package-oracle-release.sh
          echo "name=rushx-unified-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.repository == 'izafar22/voltx'
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: oracle-release/
          if-no-files-found: error
          retention-days: 30

  staging:
    if: github.repository == 'izafar22/voltx' && github.event_name == 'push' && github.ref == 'refs/heads/repair-mvp' && vars.RUSHX_STAGING_CD_ENABLED == 'true'
    needs: test
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-oracle-staging.yml
    with:
      artifact_name: ${{ needs.test.outputs.artifact_name }}
